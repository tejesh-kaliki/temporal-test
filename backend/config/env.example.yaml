server:
  port: "8080"

database:
  # Overridden by DATABASE_URL in docker-compose.
  url: "postgres://postgres:postgres@localhost:5432/temporal_test?sslmode=disable"

observability:
  service_name: "temporal-test-backend"
  # Leave empty for the no-op tracer. Set to an OTLP/gRPC collector "host:port"
  # (or OTEL_EXPORTER_OTLP_ENDPOINT) to export traces.
  endpoint: ""

temporal:
  hostport: "localhost:7233"
  namespace: "default"
  task_queue: "ingest"

qdrant:
  url: "http://localhost:6333"
  collection: "documents"

ollama:
  # Run `ollama serve` on the host and pull the models named below.
  url: "http://localhost:11434"
  embedding_model: "nomic-embed-text"
  generation_model: "llama3.2"

ingest:
  # Folder watched for files to ingest into the RAG pipeline.
  watch_dir: "./data/inbox"
  # Trigger mechanism: schedule | fsnotify | both | off.
  trigger: "schedule"
  # Schedule tick (Go duration).
  poll_interval: "30s"

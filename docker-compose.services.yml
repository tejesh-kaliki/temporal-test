# Dependencies only — postgres.
#
# Use this to run the backend on your host (go run ./cmd/server) against
# containerized dependencies, instead of building the backend image:
#
#   docker compose -f docker-compose.services.yml up -d
#   cd backend && go run ./cmd/server
#
# Ports map to the backend's local config defaults (config/env.yaml).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-temporal_test}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Temporal moved to its own compose file — a Postgres-backed multi-service
  # cluster (server + admin-tools + UI + worker), not the dev-mode single
  # container this used to run. See docker-compose.temporal.yml:
  #
  #   docker compose -f docker-compose.temporal.yml up -d

  # Qdrant vector database. REST on 6333, gRPC on 6334 (we use REST).
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrantdata:/qdrant/storage

  # Ollama is intentionally NOT containerized here — it wants host GPU/memory.
  # Run it on the host (`ollama serve`) and pull the models:
  #   ollama pull nomic-embed-text
  #   ollama pull llama3.2

volumes:
  pgdata:
  qdrantdata:

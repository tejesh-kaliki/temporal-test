# Dependencies only — postgres.
#
# Use this to run the backend on your host (go run ./cmd/server) against
# containerized dependencies, instead of building the backend image:
#
#   docker compose -f docker-compose.services.yml up -d
#   cd backend && go run ./cmd/server
#
# Ports map to the backend's local config defaults (config/env.yaml).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-temporal_test}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Temporal dev server: bundles server + SQLite persistence + Web UI (:8233).
  # Zero external DB — throwaway state, perfect for local experimentation.
  temporal:
    image: temporalio/temporal:latest
    entrypoint: ["temporal"]
    # --db-filename persists all state (workflows, schedules, history) to a SQLite
    # file on the mounted volume, so it survives container restarts. Drop the flag
    # (and the volume) to go back to throwaway in-memory state.
    command:
      - "server"
      - "start-dev"
      - "--ip"
      - "0.0.0.0"
      - "--ui-port"
      - "8233"
    ports:
      - "${TEMPORAL_PORT:-7233}:7233" # frontend gRPC
      - "${TEMPORAL_UI_PORT:-8233}:8233" # Web UI

  # Qdrant vector database. REST on 6333, gRPC on 6334 (we use REST).
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrantdata:/qdrant/storage

  # Ollama is intentionally NOT containerized here — it wants host GPU/memory.
  # Run it on the host (`ollama serve`) and pull the models:
  #   ollama pull nomic-embed-text
  #   ollama pull llama3.2

volumes:
  pgdata:
  qdrantdata:
